[package]
name = "radiate-photobooth"
version = "0.1.0"
edition = "2021"
description = "Radiate Photobooth - a local photo booth for Windows"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
    "links",
] }
nokhwa = { version = "0.10", features = ["input-msmf"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
